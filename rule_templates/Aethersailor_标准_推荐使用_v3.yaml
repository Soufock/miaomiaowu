mode: rule
dns:
  enable: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  nameserver:
    - tls://8.8.8.8
    - tls://1.1.1.1
  direct-nameserver:
    - https://120.53.53.53/dns-query
  nameserver-policy:
    geosite:cn:
      - 223.5.5.5
      - 119.29.29.29
  proxy-server-nameserver:
    - https://120.53.53.53/dns-query
  ipv6: false
  listen: 0.0.0.0:7874
  default-nameserver:
    - tls://1.12.12.12
  fake-ip-filter:
    - +.lan
    - +.local
    - +.example.com
# hosts：这里只保留可公开的域名映射。
# 内网域名 / 私网 IP 不要写进模板（模板会提交到仓库），请放在「覆写管理 → DNS 规则」里——
# 后端会把 DNS 规则中的 hosts 整块覆盖到这里，且规则只存在本机数据库、不入库。
